<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Morgan 3D material inspection</title><style>body{margin:0;background:#181b19;color:#e5dfcc;font:14px system-ui}h1,p{margin:16px}main{display:flex;flex-wrap:wrap;gap:12px;padding:12px}figure{margin:0;background:radial-gradient(at 50% 40%,#47423b,#171b18 72%);border:1px solid #73735a}canvas{display:block;width:208px;height:312px}figcaption{text-align:center;padding:8px}iframe{position:fixed;left:-800px;width:640px;height:720px;visibility:hidden}</style><h1>Morgan — two-sided figure inspection</h1><p id="status">Loading the same geometry and materials used by the gallery…</p><main><figure><canvas data-angle="0"></canvas><figcaption>Front</figcaption></figure><figure><canvas data-angle="1.57079632679"></canvas><figcaption>Side</figcaption></figure><figure><canvas data-angle="3.14159265359"></canvas><figcaption>Back</figcaption></figure><figure><canvas data-spin="true"></canvas><figcaption>Home rotation</figcaption></figure></main><iframe title="Gallery asset loader" src="../"></iframe><script type="module">import {morganHomeAngle} from "../assets/morgan-motion.js";const frame=document.querySelector('iframe'),status=document.querySelector('#status');let model,last=0;const start=performance.now();async function paint(now){requestAnimationFrame(paint);if(document.hidden||now-last<50)return;last=now;if(!model){model=frame.contentWindow?.__morgan3D;if(model){await model.ready;status.textContent='The actual 3D geometry: '+JSON.stringify(model.stats)}else if(now-start>15000)status.textContent='Waiting for the gallery renderer to finish loading.';return}for(const c of document.querySelectorAll('canvas'))model.renderAvatar(c,c.dataset.spin?morganHomeAngle((now-start)/1000):Number(c.dataset.angle))}requestAnimationFrame(paint);</script></html>
