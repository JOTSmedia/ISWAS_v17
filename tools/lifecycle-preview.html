<!doctype html><meta name="viewport" content="width=device-width,initial-scale=1"><title>Morgan release verification</title><style>body{margin:8px;background:#222;color:#eee;font:12px system-ui;display:flex;gap:12px}iframe{width:390px;height:620px;border:1px solid #aaa;flex:none}pre{max-width:360px;white-space:pre-wrap}</style><iframe id="preview" title="Release mobile preview" src="../?qa=1"></iframe><pre id="result">Waiting for startup…</pre><script>
