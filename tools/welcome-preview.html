<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Welcome timing review</title><style>body{margin:8px;background:#252525;color:#eee;font:12px system-ui}iframe{border:0;transform-origin:top left}pre{white-space:pre-wrap}</style></head><body><div id="stage"><iframe id="preview" title="Welcome website preview" src="../"></iframe></div><pre id="log">Waiting for the opening gallery…</pre><script>
const frame=document.querySelector('iframe'),q=new URLSearchParams(location.search),width=Number(q.get('width')||1280),height=Number(q.get('height')||720),scale=Math.min(1,(innerWidth-16)/width);frame.width=width;frame.height=height;frame.style.transform=`scale(${scale})`;document.querySelector('#stage').style.height=`${height*scale}px`;
const result={firstVisible:null,lastVisible:null,routeChanges:[],visibilityChanges:[],everVisible:false,openingSamples:[]};let previous='',previousVisible=false;const start=performance.now();
setInterval(()=>{const w=frame.contentWindow,d=frame.contentDocument;if(!d)return;const now=Math.round(performance.now()-start),bubble=d.querySelector('.morgan-speech-bubble');if(w.location.pathname!==previous){previous=w.location.pathname;result.routeChanges.push({at:now,route:previous})}const visible=!!bubble&&!bubble.hidden&&getComputedStyle(bubble).visibility!=='hidden';if(visible!==previousVisible){result.visibilityChanges.push({at:now,visible,projectionVisible:w.__morganProjection?.visible,inTransit:w.__morganInTransit});previousVisible=visible}
if(visible){result.everVisible=true;result.firstVisible??=now;result.lastVisible=now;result.rect=bubble.getBoundingClientRect().toJSON();result.mouth=w.__morganProjection?.mouth;result.text=bubble.textContent}
result.sceneReady=d.documentElement.classList.contains('iswas-scene-ready');if(result.sceneReady)result.sceneReadyAt??=now;result.visible=visible;result.route=previous;result.guideReady=w.__morgan3D?.isReady;if(result.guideReady)result.guideReadyAt??=now;result.elapsed=now;result.projection=w.__morganProjection;result.inTransit=w.__morganInTransit;result.guideClass=d.querySelector('#morgan-guide')?.className;if(now<20000&&result.sceneReady&&(!result.openingSamples.length||now-result.openingSamples.at(-1).at>=900))result.openingSamples.push({at:now,projection:w.__morganProjection,hero:d.querySelector('.dossier-panel')?.getBoundingClientRect().toJSON(),inTransit:w.__morganInTransit,guideClass:d.querySelector('#morgan-guide')?.className});result.stopStarted=w.__tourStopStartedAt;result.cameraArrived=w.__tourCameraArrived;result.tourRemaining=Math.round((w.__tourUntil||0)-w.performance.now());result.paused=w.__v9Paused;document.querySelector('#log').textContent=JSON.stringify(result,null,2)},100);
</script></body></html>
