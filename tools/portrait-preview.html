<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Portrait layout review</title><style>body{margin:8px;background:#252525;color:#eee;font:13px system-ui}button{padding:8px;margin:0 8px 8px 0}iframe{display:block;border:0}</style></head><body><button id="open">Open Vincent Price</button><iframe id="preview" title="Portrait website preview" width="320" height="620" src="../contact/"></iframe><pre id="audio-log"></pre><script>
const frame=document.querySelector('iframe'),q=new URLSearchParams(location.search);frame.width=Number(q.get('width')||320);frame.height=Number(q.get('height')||620);document.querySelector('#open').onclick=()=>{const w=frame.contentWindow;w.__iswasTour?.pause('qa');w.dispatchEvent(new w.CustomEvent('open-tome',{detail:w.__ISWAS_BASE+'plates/vincent-price.webp'}))};
setInterval(()=>{const w=frame.contentWindow,a=frame.contentDocument.querySelector('audio');document.querySelector('#audio-log').textContent=JSON.stringify({open:!!a,paused:a?.paused,time:a?.currentTime,preload:a?.preload,readyState:a?.readyState,duration:a?.duration,requests:w.performance.getEntriesByType('resource').filter(e=>e.name.includes('vincent-price-laugh.mp3')).length},null,2)},100);
</script></body></html>
