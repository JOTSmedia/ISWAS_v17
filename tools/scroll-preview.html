<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Section scrolling review</title><style>body{margin:8px;background:#252525;color:#eee;font:12px system-ui}iframe{border:0;display:block}pre{white-space:pre-wrap}</style></head><body><iframe title="Section scrolling preview" id="preview" width="390" height="700" src="../need/"></iframe><pre id="log">Waiting for page…</pre><script>
const frame=document.querySelector('iframe'),result={transitions:[]};let previous='';setInterval(()=>{const w=frame.contentWindow,d=frame.contentDocument,s=d.scrollingElement;if(!s)return;const route=w.location.pathname;if(route!==previous){result.transitions.push({route,scrollTop:s.scrollTop,at:Math.round(performance.now())});previous=route}Object.assign(result,{route,scrollTop:s.scrollTop,maxScroll:s.scrollHeight-s.clientHeight,paused:w.__v9Paused,tourRemaining:Math.round((w.__tourUntil||0)-w.performance.now())});document.querySelector('#log').textContent=JSON.stringify(result,null,2)},50)
</script></body></html>
